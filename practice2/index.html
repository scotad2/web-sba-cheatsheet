<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template 2</title>
</head>

<body>
    <div class="cards-container">
        <!-- Your cards will be added here using JavaScript -->
    </div>

    <script>
        const apiUrl = "https://reqres.in/api/users?per_page=12";

        async function loadUsers() {
            const container = document.querySelector(".cards-container");

            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const data = await response.json();

                for (const user of data.data) {
                    const card = document.createElement("div");
                    const image = document.createElement("img");
                    const name = document.createElement("h2");
                    const email = document.createElement("p");

                    // Populate card
                    image.src = user.avatar;
                    image.alt = `${user.first_name} ${user.last_name}`;

                    name.textContent = `${user.first_name} ${user.last_name}`;
                    email.textContent = user.email;

                    // Add elements to card
                    card.appendChild(image);
                    card.appendChild(name);
                    card.appendChild(email);

                    // Add card to container
                    container.appendChild(card);
                }
            } catch (error) {
                console.error("Failed to fetch users:", error);
                container.textContent = "Failed to load users.";
            }
        }

        loadUsers();
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .cards-container > div {
            display: flex;
            flex-direction: column;

            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;

            /* Makes cards in the same row the same height */
            height: 100%;
        }

        .cards-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .cards-container h2,
        .cards-container p {
            margin: 10px 15px;
        }

        .cards-container p {
            margin-top: 0;
        }

        /* Stack cards on mobile */
        @media (max-width: 600px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
