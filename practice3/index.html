<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template 3</title>
</head>

<body>
    <div class="filter-container">
        <!-- Select will be added using JavaScript -->
    </div>

    <div class="cards-container">
        <!-- Cards will be added here using JavaScript -->
    </div>

    <script>
        const apiUrl = "https://jsonplaceholder.typicode.com/photos?_limit=20";

        let photos = [];

        const filterContainer = document.querySelector(".filter-container");
        const cardsContainer = document.querySelector(".cards-container");

        async function loadPhotos() {
            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                photos = await response.json();

                createFilter();
                displayCards(photos);
            } catch (error) {
                console.error("Failed to fetch photos:", error);
                cardsContainer.textContent = "Failed to load photos.";
            }
        }

        function createFilter() {
            const select = document.createElement("select");

            // "All" option
            const allOption = document.createElement("option");
            allOption.value = "all";
            allOption.textContent = "All Albums";
            select.appendChild(allOption);

            // Get unique album IDs
            const albumIds = [...new Set(photos.map(photo => photo.albumId))];

            // Create option for each album ID
            for (const albumId of albumIds) {
                const option = document.createElement("option");

                option.value = albumId;
                option.textContent = `Album ${albumId}`;

                select.appendChild(option);
            }

            // Listen for filter changes
            select.addEventListener("change", () => {
                const selectedAlbum = select.value;

                if (selectedAlbum === "all") {
                    displayCards(photos);
                } else {
                    const filteredPhotos = photos.filter(
                        photo => photo.albumId === Number(selectedAlbum)
                    );

                    displayCards(filteredPhotos);
                }
            });

            filterContainer.appendChild(select);
        }

        function displayCards(data) {
            // Clear existing cards
            cardsContainer.innerHTML = "";

            for (const photo of data) {
                const card = document.createElement("div");
                const image = document.createElement("img");
                const title = document.createElement("h2");
                const album = document.createElement("p");

                image.src = photo.thumbnailUrl;
                image.alt = photo.title;

                title.textContent = photo.title;
                album.textContent = `Album ID: ${photo.albumId}`;

                card.appendChild(image);
                card.appendChild(title);
                card.appendChild(album);

                cardsContainer.appendChild(card);
            }
        }

        loadPhotos();
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
        }

        .filter-container {
            max-width: 1000px;
            margin: 0 auto 20px;
        }

        .filter-container select {
            padding: 8px;
            font-size: 1rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .cards-container > div {
            display: flex;
            flex-direction: column;

            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;

            height: 100%;
        }

        .cards-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .cards-container h2 {
            font-size: 1.1rem;
            margin: 15px 15px 5px;
        }

        .cards-container p {
            margin: 0 15px 15px;
        }

        @media (max-width: 600px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
