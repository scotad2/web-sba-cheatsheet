<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template 1</title>
</head>

<body>
    <div class="card" id="book-card">
        <!-- Do not hardcode the content here, use JavaScript -->
    </div>

    <script>
        const book = {
            "id": 42,
            "title": "The Hitchhiker's Guide to the Galaxy",
            "author": "Douglas Adams",
            "year": 1979,
            "genres": ["Science Fiction", "Comedy", "Adventure"],
            "pages": 224,
            "language": "English",
            "imageUrl": "https://images-na.ssl-images-amazon.com/images/I/81XSN3hA5gL.jpg"
        };

        const card = document.getElementById("book-card");

        // Create elements
        const image = document.createElement("img");
        const content = document.createElement("div");
        const title = document.createElement("h1");
        const author = document.createElement("h2");
        const details = document.createElement("div");
        const year = document.createElement("p");
        const pages = document.createElement("p");
        const language = document.createElement("p");
        const genres = document.createElement("p");

        // Populate elements
        image.src = book.imageUrl;
        image.alt = book.title;

        title.textContent = book.title;
        author.textContent = book.author;

        year.textContent = `Year: ${book.year}`;
        pages.textContent = `Pages: ${book.pages}`;
        language.textContent = `Language: ${book.language}`;
        genres.textContent = `Genres: ${book.genres.join(", ")}`;

        // Build details section
        details.appendChild(year);
        details.appendChild(pages);
        details.appendChild(language);
        details.appendChild(genres);

        // Build content section
        content.appendChild(title);
        content.appendChild(author);
        content.appendChild(details);

        // Build card
        card.appendChild(image);
        card.appendChild(content);
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .card {
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
            color: #333;

            /* Flexbox */
            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .card > div {
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 8px;
        }

        .card h1 {
            font-size: 1.5em;
            margin: 0;
        }

        .card h2 {
            margin: 0;
            font-size: 1em;
        }

        .card p {
            margin: 0;
        }

        .card h1,
        .card h2 {
            text-transform: uppercase;
        }
    </style>
</body>
</html>
